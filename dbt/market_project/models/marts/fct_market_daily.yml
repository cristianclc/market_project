version: 2

models:
  - name: fct_market_daily
    description: "una fila por día, con el total del mercado. Responde “¿cuál es la participación de Bitcoin?” y “¿cómo cambió el volumen total?”" 
    config:
      materialized: table
    columns:
      - name: snapshot_date 
        data_tests:
          - not_null
          - unique
      - name: bitcoin_cap_participation_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: coins_day
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100