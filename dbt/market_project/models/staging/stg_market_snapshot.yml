version: 2

models:
  - name: stg_market_snapshot
    description: "Tabla de staging con trasnformaciones en nombres de las columnas de CoinGecko, además de deduplicación usando coin_id y last_update"
    config:
      materialized: view
    columns:
      - name: coin_id 
        data_tests:
          - not_null
      - name: current_price 
        data_tests:
          - not_null
      - name: snapshot_date 
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
            - coin_id
            - snapshot_date